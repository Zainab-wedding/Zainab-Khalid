<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دعوة زفاف زينب وخالد</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #05100a; color: #f7eedd; font-family: 'Amiri', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* الورود الذهبية المتساقطة */
        .petal { position: absolute; top: -10px; color: #d4af37; font-size: 20px; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }

        /* الظرف والبطاقة */
        .envelope-container { cursor: pointer; text-align: center; }
        .card-frame { display: none; width: 90%; max-width: 400px; background: rgba(13, 40, 28, 0.95); border: 2px solid #d4af37; padding: 30px; border-radius: 20px; text-align: center; position: relative; }
        
        .timer { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .timer div { background: #d4af37; color: #05100a; padding: 10px; border-radius: 5px; font-weight: bold; }
        
        .rsvp-btn { display: block; background: #d4af37; color: #05100a; padding: 15px; text-decoration: none; border-radius: 30px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- موسيقى خلفية -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="envelope-container" id="env" onclick="start()">
        <div style="width: 200px; height: 150px; background: #d4af37; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: bold; color: #05100a;">افتح الظرف ✉️</div>
    </div>

    <div class="card-frame" id="card">
        <h2>زينب & خالد</h2>
        <div class="timer" id="countdown"></div>
        <p>بانتظاركم يوم 23 أكتوبر 2026</p>
        <a href="https://forms.gle/YOUR_GOOGLE_FORM_LINK" class="rsvp-btn">تأكيد الحضور</a>
        <button onclick="document.getElementById('bgMusic').pause()" style="margin-top:10px; background:none; border:none; color:#d4af37; cursor:pointer;">إيقاف الموسيقى 🔇</button>
    </div>

    <script>
        // العد التنازلي
        const target = new Date("Oct 23, 2026 00:00:00").getTime();
        setInterval(() => {
            let now = new Date().getTime();
            let diff = target - now;
            let d = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("countdown").innerHTML = `<div>${d} يوم</div>`;
        }, 1000);

        // تشغيل التجربة
        function start() {
            document.getElementById('env').style.display = 'none';
            document.getElementById('card').style.display = 'block';
            document.getElementById('bgMusic').play();
            createPetals();
        }

        // تساقط الورود
        function createPetals() {
            for(let i=0; i<20; i++) {
                let p = document.createElement('div');
                p.innerHTML = '✨';
                p.className = 'petal';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = Math.random() * 3 + 2 + 's';
                document.body.appendChild(p);
            }
        }
    </script>
</body>
</html>
